server:
  port: 8080

spring:
  ai:
    mcp:
      client:
        type: ASYNC
        sse:
          connections:
            server1:
              url: http://localhost:9090
        stdio:
          connections:
            server2:
              command: java
              args:
                - -Dspring.ai.mcp.server.stdio=true
                - -Dspring.main.web-application-type=none
                - -Dspring.main.banner-mode=off
                - -jar
                - ${stdio-server-jar}
    dashscope:
      api-key: ${api-key}
      chat:
        options:
          model: qwen-plus
    ollama:
      chat:
        model: deepseek-r1:8b