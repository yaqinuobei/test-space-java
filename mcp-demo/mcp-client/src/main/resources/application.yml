server:
  port: 8080

spring:
  ai:
    mcp:
      client:
        type: ASYNC
        sse:
          connections:
            server1:
              url: http://localhost:9090
        stdio:
          connections:
            server2:
              command: java
              args:
                - -Dspring.ai.mcp.server.stdio=true
                - -Dspring.main.web-application-type=none
                - -Dspring.main.banner-mode=off
                - -jar
                - ${stdio-server-jar}
    openai:
      configs:
        #非思考模型 deepseek-chat 、思考模型 deepseek-reasoner
        - name: deepseek-chat
          api-key: sk-5816efb2fe5241ac842d043184b33573
          base-url: https://api.deepseek.com
          chat.options.model: deepseek-chat
      api-key: sk-5816efb2fe5241ac842d043184b33573
      chat:
        api-key: sk-5816efb2fe5241ac842d043184b33573
        base-url: https://api.deepseek.com/v1
        options:
          model: deepseek-chat
      image:
        api-key: sk-5816efb2fe5241ac842d043184b33573
        base-url: https://api.deepseek.com/v1
    dashscope:
      chat:
        api-key: ${dashscope-api-key}
        options:
          model: qwen-plus
      image:
        api-key: ${dashscope-api-key}
        options:
          model: qwen-image
        base-url: https://dashscope.aliyuncs.com
      audio:
        synthesis:
          api-key: ${dashscope-api-key}
          options:
            model: wan2.2-t2v-plus
        transcription:
          api-key: ${dashscope-api-key}
      rerank:
        api-key: ${dashscope-api-key}
      api-key: ${dashscope-api-key}
