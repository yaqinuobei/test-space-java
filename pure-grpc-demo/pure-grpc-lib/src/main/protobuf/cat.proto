syntax = "proto3";

option java_multiple_files = true;
option java_package = "code.traveler.test.space.java.pure.grpc.lib.cat";
option java_outer_classname = "CatProto";

package code.traveler.test.space.java.pure.grpc.lib.protobuf;

message CatRequest{
  string sNum = 1;
}

message CatResponse{
  string sNum = 1;
  string name = 2;
}
