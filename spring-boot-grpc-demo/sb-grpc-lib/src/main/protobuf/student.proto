syntax = "proto3";

option java_multiple_files = true;
option java_package = "code.traveler.test.space.java.sb.grpc.lib.student";
option java_outer_classname = "StudentProto";

package code.traveler.test.space.java.sb.grpc.lib.protobuf;

service Student {
  rpc getDetail (stream StudentRequest) returns (stream StudentResponse){};
}

message StudentRequest{
  string name = 1;
  int32 sNum = 2;
}

message StudentResponse{
  int32 sNum = 1;
  string name = 2;
  int32 age = 3;
  int32 sex = 4;
}
